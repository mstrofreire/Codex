# Descarga los resultados oficiales del Congreso (Infoelectoral) de todas las generales desde 1977 y guarda
# en la rama los ficheros pequeños por circunscripción (03, 07, 08) con su procedencia. Corre en GitHub
# porque Infoelectoral no responde desde el entorno de trabajo.
name: Datos históricos (Infoelectoral)

on:
  workflow_dispatch:
  push:
    branches: [ccr-a535fa35-odfdkn]
    paths: [.github/workflows/historico.yml, .github/puente/**]

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Conectividad
        run: |
          for u in https://infoelectoral.interior.gob.es/ https://web.archive.org/ http://www.infoelectoral.mir.es/; do
            printf '%s ' "$u"; curl -sS -o /dev/null --connect-timeout 15 --max-time 30 -w '%{http_code}\n' "$u" || true
          done
      - name: Sondeo de fuentes alternativas
        run: python3 .github/puente/sondeo.py motion-demo/src/voto/historico/puente
      - name: Guardar en la rama
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-demo/src/voto/historico
          git commit -m "Bridge: responses fetched from the GitHub runner" || echo "nada que guardar"
          git push
