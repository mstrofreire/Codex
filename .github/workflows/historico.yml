# Descarga los resultados oficiales del Congreso (Infoelectoral, Ministerio del Interior) de todas las
# generales desde 1977 y guarda en la rama los ficheros pequeños que hacen falta: 03 (candidaturas),
# 07 (datos por circunscripción) y 08 (votos y escaños por candidatura y circunscripción).
name: Datos históricos (Infoelectoral)

on:
  workflow_dispatch:
  push:
    branches: [ccr-a535fa35-odfdkn]
    paths: [.github/workflows/historico.yml]

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y extraer
        run: |
          set -u
          out=motion-demo/src/voto/historico/infoelectoral
          mkdir -p "$out"
          : > "$out/descarga.log"
          for f in 197706 197903 198210 198606 198910 199306 199603 200003 200403 200803 201111 201512 201606 201904 201911 202307; do
            url="https://infoelectoral.interior.gob.es/estaticos/docxl/apliextr/02${f}_TOTA.zip"
            if curl -fsSL --retry 4 --retry-delay 5 --max-time 300 -A "Mozilla/5.0" -o "/tmp/$f.zip" "$url"; then
              (cd /tmp && sha256sum "$f.zip") >> "$out/SHA256SUMS"
              unzip -l "/tmp/$f.zip" > "$out/$f.contenido.txt"
              mkdir -p "$out/$f"
              unzip -o -j "/tmp/$f.zip" '03*' '07*' '08*' 'FICHEROS*' -d "$out/$f" >/dev/null || unzip -o -j "/tmp/$f.zip" -x '*0[459]*' '*1[0-9]*' -d "$out/$f" >/dev/null || true
              echo "OK $f $(stat -c %s /tmp/$f.zip) bytes" | tee -a "$out/descarga.log"
            else
              echo "FALLO $f $url" | tee -a "$out/descarga.log"
            fi
          done
          ls -la "$out"/*/ | head -80
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-demo/src/voto/historico
          git commit -m "Add official Infoelectoral Congress files (03/07/08) for 1977-2023" || echo "nada que guardar"
          git push
