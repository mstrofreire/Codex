name: Comprobar tareas

on:
  push:
    paths:
      - "TAREAS.md"
  pull_request:
    paths:
      - "TAREAS.md"

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 herramientas/comprobar_tareas.py TAREAS.md
